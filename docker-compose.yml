services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xdworld-postgres
    environment:
      POSTGRES_USER: xdworld
      POSTGRES_PASSWORD: xdworld
      POSTGRES_DB: xdworld_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdworld -d xdworld_agent"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: xdworld-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: xdworld-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://xdworld:xdworld@postgres:5432/xdworld_agent
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
